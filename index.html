// =============== 甘特图筛选 ===============
function setGanttFilter(filter) {
  ganttFilter = filter;
  document.querySelectorAll('#ganttFilterGroup .gantt-filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });
  renderGantt();
}

// 渲染甘特图：按周为单位
function renderGantt() {
  const months = parseInt(document.getElementById('ganttRange').value);
  const container = document.getElementById('ganttContent');

  if (state.projects.length === 0) {
    container.innerHTML = '<div class="gantt-empty">还没有长期项目，点上方"+ 新增项目"开始</div>';
    document.getElementById('ganttRangeLabel').textContent = '';
    return;
  }

  // 按筛选条件过滤（不修改 state.projects）
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayStr = fmt(today);

  const filteredProjects = filterByCategory(state.projects.filter(p => {
    if (ganttFilter === 'all') return true;
    const isOverdue = !p.done && p.end < todayStr;
    if (ganttFilter === 'overdue') return isOverdue;
    if (ganttFilter === 'done')    return p.done;
    if (ganttFilter === 'active')  return !p.done && !isOverdue;
    return true;
  }));

  // 排序：重要性高 → 逾期 → 将逾期 → 其他
  filteredProjects.sort((a, b) => {
    const pa = a.priority || 2;
    const pb = b.priority || 2;
    // 已完成的排最后
    if (a.done && !b.done) return 1;
    if (!a.done && b.done) return -1;
    // 重要性优先
    if (pa !== pb) return pa - pb;
    // 逾期状态
    const aOverdue = !a.done && a.end < todayStr;
    const bOverdue = !b.done && b.end < todayStr;
    if (aOverdue && !bOverdue) return -1;
    if (!aOverdue && bOverdue) return 1;
    // 将逾期（3天内）
    const aDaysLeft = daysBetween(today, parseDate(a.end));
    const bDaysLeft = daysBetween(today, parseDate(b.end));
    const aSoon = !a.done && aDaysLeft <= 3 && aDaysLeft >= 0;
    const bSoon = !b.done && bDaysLeft <= 3 && bDaysLeft >= 0;
    if (aSoon && !bSoon) return -1;
    if (!aSoon && bSoon) return 1;
    // 最后按截止日期升序
    return aDaysLeft - bDaysLeft;
  });

  if (filteredProjects.length === 0) {
    const labels = { all: '全部', active: '进行中', done: '已完成', overdue: '逾期' };
    container.innerHTML = `<div class="gantt-empty">没有「${labels[ganttFilter]}」的项目</div>`;
    document.getElementById('ganttRangeLabel').textContent = '';
    return;
  }

  // 时间范围：从今天所在周的周一开始，到 months 个月后
  const rangeStart = startOfWeek(today);

  // 看一下项目实际跨度，扩大显示范围
  let earliestStart = rangeStart;
  filteredProjects.forEach(p => {
    const ps = parseDate(p.start);
    if (ps < earliestStart) earliestStart = ps;
  });
  earliestStart = startOfWeek(earliestStart);
  ganttEarliestStart = earliestStart; // expose for resize drag

  const rangeEnd = new Date(today);
  rangeEnd.setMonth(rangeEnd.getMonth() + months);

  let actualEnd = rangeEnd;
  filteredProjects.forEach(p => {
    const pe = parseDate(p.end);
    if (pe > actualEnd) actualEnd = pe;
  });

  const totalWeeks = Math.ceil(daysBetween(earliestStart, actualEnd) / 7) + 1;

  document.getElementById('ganttRangeLabel').textContent =
    `${fmt(earliestStart)} 至 ${fmt(actualEnd)}（${totalWeeks} 周）`;

  // 表头：月份行 + 周序号行
  const weekColWidth = 36;
  const monthGroups = [];
  let currentMonth = -1;
  let currentMonthWeeks = 0;
  let currentMonthLabel = '';

  for (let i = 0; i < totalWeeks; i++) {
    const w = addDays(earliestStart, i * 7);
    const m = w.getMonth();
    const y = w.getFullYear();
    if (m !== currentMonth) {
      if (currentMonthWeeks > 0) {
        monthGroups.push({ label: currentMonthLabel, weeks: currentMonthWeeks });
      }
      currentMonth = m;
      currentMonthLabel = `${y}年${m + 1}月`;
      currentMonthWeeks = 1;
    } else {
      currentMonthWeeks++;
    }
  }
  if (currentMonthWeeks > 0) {
    monthGroups.push({ label: currentMonthLabel, weeks: currentMonthWeeks });
  }

  let html = '<table class="gantt-table"><thead>';
  html += '<tr><th class="gantt-name-col gantt-name-col-header" rowspan="2">项目</th>';
  monthGroups.forEach(g => {
    html += `<th class="gantt-month-cell" colspan="${g.weeks}">${g.label}</th>`;
  });
  html += '</tr><tr>';
  for (let i = 0; i < totalWeeks; i++) {
    const w = addDays(earliestStart, i * 7);
    const isThisWeek = fmt(w) <= todayStr && fmt(addDays(w, 6)) >= todayStr;
    html += `<th class="gantt-week-cell${isThisWeek ? ' today' : ''}" title="${fmt(w)}">${w.getMonth()+1}/${w.getDate()}</th>`;
  }
  html += '</tr></thead><tbody>';

  // 项目行
  filteredProjects.forEach(p => {
    const ps = parseDate(p.start);
    const pe = parseDate(p.end);
    const startWeekIdx = Math.floor(daysBetween(earliestStart, ps) / 7);
    const endWeekIdx = Math.floor(daysBetween(earliestStart, pe) / 7);
    const startDayOffset = daysBetween(earliestStart, ps) % 7;
    const totalDays = daysBetween(ps, pe) + 1;

    const left = startWeekIdx * weekColWidth + (startDayOffset / 7) * weekColWidth;
    const width = (totalDays / 7) * weekColWidth;

    const progress = calcProjectProgress(p);
    const pct = progress.pct;

    // 风险样式：逾期未完成 → 红；距截止 ≤3 天 → 黄
    const daysToEnd = daysBetween(today, pe);
    let riskClass = '';
    if (!p.done) {
      if (today > pe) riskClass = 'risk-red';
      else if (daysToEnd <= 3) riskClass = 'risk-yellow';
    }

    const barLabel = `${escapeHtml(p.name)}`;

    // 构建甘特条 tooltip：名称、日期、进度、剩余/逾期天数
    let timeStatus;
    if (today > pe) {
      const overdueDays = daysBetween(pe, today);
      timeStatus = `已逾期 ${overdueDays} 天`;
    } else {
      timeStatus = `剩余 ${daysToEnd} 天`;
    }
    const barTitle = `${p.name}\n开始：${p.start}\n截止：${p.end}\n进度：${pct}%\n${timeStatus}`;

    html += `<tr class="gantt-row">
      <td class="gantt-name-col">
        <div class="project-name" onclick="openProjectModal('${p.id}')">
          <span class="project-color-dot" style="background:${p.color}"></span>
          <span style="${p.done ? 'text-decoration:line-through;opacity:0.5' : ''}">${escapeHtml(p.name)}</span>
          ${(() => { const pLabels = {1:'🔴',2:'🟡',3:'🔵',4:'⚪'}; return p.priority ? '<span style="font-size:10px;margin-left:4px">'+pLabels[p.priority]+'</span>' : ''; })()}
        </div>
        <div style="font-size:11px;color:var(--ink-light);margin-top:3px">
          ${(() => { const pCat = p.category ? (state.categories || []).find(c => c.id === p.category) : null; return pCat ? '<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:1px 6px;border-radius:10px;background:'+pCat.color+'15;color:'+pCat.color+';border:1px solid '+pCat.color+'30;margin-right:4px"><span style="width:5px;height:5px;border-radius:50%;background:'+pCat.color+'"></span>'+escapeHtml(pCat.name)+'</span>' : ''; })()}
          ${p.start} ~ ${p.end}
          <button class="icon-btn" onclick="toggleProjectDone('${p.id}', event)" title="标记完成">${p.done ? '↺' : '✓'}</button>
          <button class="icon-btn" onclick="event.stopPropagation(); showProjectDetail('${p.id}')" title="查看详情">⋯</button>
        </div>
      </td>
      <td colspan="${totalWeeks}" style="position:relative;padding:0;height:40px">
        <div class="gantt-bar ${p.done ? 'done' : ''} ${riskClass}"
             style="left:${left}px;width:${Math.max(width, 30)}px;background:${p.color}"
             data-project-id="${p.id}"
             onclick="openProjectModal('${p.id}')"
             title="${escapeHtml(barTitle)}">
          <span class="gantt-resize-handle handle-left"
                data-project-id="${p.id}" data-side="left"
                title="拖动调整开始日期"></span>
          <span class="gantt-bar-label" style="flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none">${barLabel}</span>
          <span class="gantt-resize-handle handle-right"
                data-project-id="${p.id}" data-side="right"
                title="拖动调整结束日期"></span>
        </div>
      </td>
    </tr>`;
  });

  // 今日竖线
  const todayDayIdx = daysBetween(earliestStart, today);
  const todayWeekIdx = Math.floor(todayDayIdx / 7);
  const todayDayInWeek = todayDayIdx % 7;
  html += `</tbody></table>`;

  container.innerHTML = html;

  // 添加今日线（基于实际 DOM 位置）
  const table = container.querySelector('.gantt-table');
  if (table && todayWeekIdx >= 0 && todayWeekIdx < totalWeeks) {
    const headerRow = table.querySelector('thead tr:last-child');
    const weekThs = headerRow ? headerRow.querySelectorAll('th') : [];
    if (weekThs[todayWeekIdx]) {
      const th = weekThs[todayWeekIdx];
      const tableRect = table.getBoundingClientRect();
      const thRect = th.getBoundingClientRect();
      const thLeft = thRect.left - tableRect.left;
      const dayOffset = (todayDayInWeek / 7) * thRect.width;

      const indicator = document.createElement('div');
      indicator.style.cssText = `
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: var(--accent);
        pointer-events: none;
        z-index: 5;
      `;
      indicator.style.left = `${thLeft + dayOffset}px`;
      table.style.position = 'relative';
      table.appendChild(indicator);
    }
  }
}

// =============== 已完成折叠切换 ===============
function toggleShowWeekDone() {
  showWeekDone = !showWeekDone;
  const btn = document.getElementById('weekDoneToggle');
  if (btn) {
    btn.textContent = showWeekDone ? '隐藏已完成' : '显示已完成';
    btn.classList.toggle('btn-done-active', showWeekDone);
  }
  renderWeek();
}

function toggleShowDayDone() {
  showDayDone = !showDayDone;
  const btn = document.getElementById('dayDoneToggle');
  if (btn) {
    btn.textContent = showDayDone ? '隐藏已完成' : '显示已完成';
    btn.classList.toggle('btn-done-active', showDayDone);
  }
  renderDay();
}

// =============== 周甘特图 ===============
function changeWeek(delta) {
  if (delta === 0) currentWeekStart = startOfWeek(new Date());
  else currentWeekStart = addDays(currentWeekStart, delta * 7);
  renderWeek();
}

function renderWeek() {
  const start = currentWeekStart;
  const end = addDays(start, 6);
  document.getElementById('weekLabel').textContent =
    `${fmt(start)} ~ ${fmt(end)}`;
  renderWeekGantt();
}

// =============== 周甘特图（table 布局） ===============
function renderWeekGantt() {
  const container = document.getElementById('weekBoard');
  if (!container) return;

  const start = currentWeekStart;
  const end = addDays(start, 6);
  const startStr = fmt(start);
  const endStr = fmt(end);
  const todayStr = fmt(new Date());
  const dayNames = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

  // 本周所有任务（区间重叠：任务的 [startDate, endDate] 与本周 [startStr, endStr] 有交集）
  const allWeekTasks = filterByCategory(state.tasks.filter(t => {
    const taskStartStr = t.startDate || t.date;
    const taskEndStr   = t.endDate   || t.date;
    return taskStartStr <= endStr && taskEndStr >= startStr;
  }));
  // 按 showWeekDone 过滤
  const weekTasks = showWeekDone ? allWeekTasks : allWeekTasks.filter(t => !t.done);

  // 容器先清空，写入标题
  container.innerHTML = `<div class="week-gantt-heading">📅 周甘特图</div>`;

  // 空状态
  if (allWeekTasks.length === 0) {
    const wrap = document.createElement('div');
    wrap.className = 'week-gantt-empty-wrap';
    const hint = document.createElement('button');
    hint.className = 'empty-hint';
    hint.textContent = '本周还没有任务，点这里添加';
    hint.addEventListener('click', () => openTaskModal('week', fmt(start)));
    wrap.appendChild(hint);
    container.appendChild(wrap);
    return;
  }

  // ---- 构建 <table class="week-gantt-table"> ----
  const table = document.createElement('table');
  table.className = 'week-gantt-table';

  // 表头
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');

  // 第一列：任务
  const thTask = document.createElement('th');
  thTask.className = 'week-gantt-task-col';
  thTask.textContent = '任务';
  headerRow.appendChild(thTask);

  // 后 7 列：周一~周日 + 日期 + 小 + 按钮
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i);
    const dateStr = fmt(d);
    const isToday = dateStr === todayStr;
    const th = document.createElement('th');
    if (isToday) th.className = 'today';

    const dateMain = document.createElement('span');
    dateMain.className = 'week-gantt-date-main';
    dateMain.textContent = `${d.getMonth() + 1}/${d.getDate()}`;

    const dateSub = document.createElement('span');
    dateSub.className = 'week-gantt-date-sub';
    dateSub.textContent = dayNames[i];

    const addBtn = document.createElement('button');
    addBtn.className = 'week-gantt-add-btn';
    addBtn.title = `在 ${dateStr} 新增任务`;
    addBtn.textContent = '+';
    addBtn.addEventListener('click', e => {
      e.stopPropagation();
      openTaskModal('week', dateStr);
    });

    th.appendChild(dateMain);
    th.appendChild(dateSub);
    th.appendChild(document.createElement('br'));
    th.appendChild(addBtn);
    headerRow.appendChild(th);
  }
  thead.appendChild(headerRow);
  table.appendChild(thead);

  // 表体
  const tbody = document.createElement('tbody');

  // 收集本周所有有任务的任务列表（按任务排序）
  const sortedTasks = sortTasks(weekTasks);

  if (sortedTasks.length === 0) {
    // 全部已完成且被折叠
    const tr = document.createElement('tr');
    tr.className = 'week-gantt-row';
    const td = document.createElement('td');
    td.colSpan = 8;
    td.style.padding = '16px';
    const hint = document.createElement('button');
    hint.className = 'empty-hint folded';
    const hiddenTotal = allWeekTasks.filter(t => t.done).length;
    hint.textContent = `${hiddenTotal} 项已完成（已折叠）`;
    hint.addEventListener('click', toggleShowWeekDone);
    td.appendChild(hint);
    tr.appendChild(td);
    tbody.appendChild(tr);
  } else {
    sortedTasks.forEach((t, taskIdx) => {
      const project = t.projectId ? state.projects.find(p => p.id === t.projectId) : null;
      // 板块：任务自身 > 项目继承
      const cat = t.category
        ? (state.categories || []).find(c => c.id === t.category)
        : (project && project.category ? (state.categories || []).find(c => c.id === project.category) : null);
      // 颜色优先级：项目色 > 板块色 > 按序轮换
      const TASK_COLORS = ['#007aff','#34c759','#ff9500','#ff3b30','#af52de','#ff2d55','#5ac8fa','#ffcc00','#30b0c7','#ff6482','#4cd964','#8e44ad','#e74c3c','#1abc9c','#f39c12','#3498db'];
      const barColor = project ? project.color : (cat ? cat.color : TASK_COLORS[taskIdx % TASK_COLORS.length]);

      // 任务实际起止日期（兼容旧数据只有 date 字段）
      const taskStartStr = t.startDate || t.date;
      const taskEndStr   = t.endDate   || t.date;

      // 时间标签
      const timeStr = t.startTime || t.time || '';
      const endTimeStr = t.endTime || '';
      let timeLabel = '';
      if (timeStr && endTimeStr) timeLabel = `${timeStr}–${endTimeStr}`;
      else if (timeStr) timeLabel = timeStr;

      const tr = document.createElement('tr');
      tr.className = 'week-gantt-row';

      // ---- 左侧任务列 ----
      const tdTask = document.createElement('td');
      tdTask.className = 'week-gantt-task-col';

      const taskInfo = document.createElement('div');
      taskInfo.className = 'week-gantt-task-info';

      const taskTitleRow = document.createElement('div');
      taskTitleRow.style.display = 'flex';
      taskTitleRow.style.alignItems = 'flex-start';
      taskTitleRow.style.gap = '4px';

      // 完成按钮
      const checkBtn = document.createElement('button');
      checkBtn.className = 'week-gantt-task-check';
      checkBtn.title = t.done ? '标记未完成' : '标记完成';
      checkBtn.textContent = t.done ? '↺' : '✓';
      checkBtn.addEventListener('click', e => {
        e.stopPropagation();
        toggleTaskDone('week', t.id);
      });

      const titleSpan = document.createElement('span');
      titleSpan.className = 'week-gantt-task-title' + (t.done ? ' done' : '');
      titleSpan.textContent = t.title;

      taskTitleRow.appendChild(checkBtn);
      taskTitleRow.appendChild(titleSpan);
      taskInfo.appendChild(taskTitleRow);

      // 元信息行：时间 + 日期范围 + 项目色点+名
      const metaRow = document.createElement('div');
      metaRow.className = 'week-gantt-task-meta';

      if (timeLabel) {
        const timeSpan = document.createElement('span');
        timeSpan.className = 'task-time';
        timeSpan.textContent = timeLabel;
        metaRow.appendChild(timeSpan);
      }

      // 日期范围：单日只显示起始日，跨日显示 start ~ end
      const dateRangeSpan = document.createElement('span');
      dateRangeSpan.style.fontSize = '10px';
      dateRangeSpan.style.color = 'var(--ink-light)';
      if (taskStartStr === taskEndStr) {
        dateRangeSpan.textContent = taskStartStr;
      } else {
        dateRangeSpan.textContent = `${taskStartStr} ~ ${taskEndStr}`;
      }
      metaRow.appendChild(dateRangeSpan);

      if (project) {
        const projTag = document.createElement('span');
        projTag.style.cssText = `display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:1px 7px;border-radius:10px;background:${project.color}15;color:${project.color};border:1px solid ${project.color}30;font-weight:500`;
        const dot = document.createElement('span');
        dot.style.cssText = `width:6px;height:6px;border-radius:50%;background:${project.color};flex-shrink:0`;
        projTag.appendChild(dot);
        projTag.appendChild(document.createTextNode(project.name));
        metaRow.appendChild(projTag);
      }
      if (cat) {
        const catTag = document.createElement('span');
        catTag.style.cssText = `display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:1px 7px;border-radius:10px;background:${cat.color}15;color:${cat.color};border:1px solid ${cat.color}30;font-weight:500`;
        const cdot = document.createElement('span');
        cdot.style.cssText = `width:6px;height:6px;border-radius:50%;background:${cat.color};flex-shrink:0`;
        catTag.appendChild(cdot);
        catTag.appendChild(document.createTextNode(cat.name));
        metaRow.appendChild(catTag);
      }
      if (!project && !cat) {
        const noProj = document.createElement('span');
        noProj.style.cssText = 'font-size:10px;color:var(--ink-light);font-style:italic';
        noProj.textContent = '独立任务';
        metaRow.appendChild(noProj);
      }

      if (metaRow.children.length > 0) taskInfo.appendChild(metaRow);

      tdTask.appendChild(taskInfo);
      // 整行单击编辑
      tdTask.style.cursor = 'pointer';
      tdTask.addEventListener('click', () => openTaskModal('week', null, t.id));
      tr.appendChild(tdTask);

      // ---- 右侧 7 天列（colSpan 跨天） ----
      // 计算任务在本周内的可见起止列索引（0=周一 … 6=周日）
      const visibleStartIdx = Math.max(0, daysBetween(start, parseDate(taskStartStr)));
      const visibleEndIdx   = Math.min(6, daysBetween(start, parseDate(taskEndStr)));

      // 甘特条 tooltip
      const barTooltip = timeLabel
        ? `${t.title}\n${taskStartStr} ~ ${taskEndStr}\n${timeLabel}`
        : `${t.title}\n${taskStartStr} ~ ${taskEndStr}`;

      // 输出 visibleStartIdx 之前的空 td
      for (let i = 0; i < visibleStartIdx; i++) {
        const d = addDays(start, i);
        const td = document.createElement('td');
        td.className = 'week-gantt-day-cell' + (fmt(d) === todayStr ? ' today' : '');
        tr.appendChild(td);
      }

      // 输出跨列 td（包含甘特条）
      const spanTd = document.createElement('td');
      spanTd.colSpan = visibleEndIdx - visibleStartIdx + 1;
      // 如果跨列范围内包含今日列，加 today 样式
      let spanHasToday = false;
      for (let i = visibleStartIdx; i <= visibleEndIdx; i++) {
        if (fmt(addDays(start, i)) === todayStr) { spanHasToday = true; break; }
      }
      spanTd.className = 'week-gantt-day-cell' + (spanHasToday ? ' today' : '');

      const track = document.createElement('div');
      track.className = 'week-gantt-track';

      const bar = document.createElement('div');
      // 逾期标红，将要逾期标黄
      let weekBarRisk = '';
      if (!t.done) {
        const taskEndStr = t.endDate || t.date;
        if (taskEndStr && taskEndStr < todayStr) weekBarRisk = ' week-risk-red';
        else if (taskEndStr && taskEndStr === todayStr) weekBarRisk = ' week-risk-yellow';
      }
      bar.className = 'week-gantt-bar' + (t.done ? ' done' : '') + weekBarRisk;
      bar.style.background = barColor;
      bar.title = barTooltip;

      if (timeLabel) {
        const timeTag = document.createElement('span');
        timeTag.className = 'week-gantt-bar-time';
        timeTag.textContent = timeLabel;
        bar.appendChild(timeTag);
      }

      const barTitleSpan = document.createElement('span');
      barTitleSpan.className = 'week-gantt-bar-title';
      barTitleSpan.title = t.title;
      barTitleSpan.textContent = t.title;
      bar.appendChild(barTitleSpan);

      const barCheck = document.createElement('button');
      barCheck.className = 'week-gantt-bar-check';
      barCheck.title = t.done ? '标记未完成' : '标记完成';
      barCheck.textContent = t.done ? '↺' : '✓';
      barCheck.addEventListener('click', e => {
        e.stopPropagation();
        toggleTaskDone('week', t.id);
      });
      bar.appendChild(barCheck);

      // 整条单击打开编辑
      bar.addEventListener('click', () => openTaskModal('week', null, t.id));

      track.appendChild(bar);
      spanTd.appendChild(track);
      tr.appendChild(spanTd);

      // 输出 visibleEndIdx 之后的空 td
      for (let i = visibleEndIdx + 1; i < 7; i++) {
        const d = addDays(start, i);
        const td = document.createElement('td');
        td.className = 'week-gantt-day-cell' + (fmt(d) === todayStr ? ' today' : '');
        tr.appendChild(td);
      }

      tbody.appendChild(tr);
    });

    // 如果有已完成被折叠，在表格底部加一行提示
    if (!showWeekDone) {
      const hiddenTotal = allWeekTasks.filter(t => t.done).length;
      if (hiddenTotal > 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 8;
        td.style.padding = '8px 12px';
        const hint = document.createElement('button');
        hint.className = 'empty-hint folded';
        hint.style.marginTop = '0';
        hint.textContent = `${hiddenTotal} 项已完成（已折叠）`;
        hint.addEventListener('click', toggleShowWeekDone);
        td.appendChild(hint);
        tr.appendChild(td);
        tbody.appendChild(tr);
      }
    }
  }

  table.appendChild(tbody);
  container.appendChild(table);
}

// =============== 日四象限 ===============
function changeDay(delta) {
  if (delta === 0) currentDay = fmt(new Date());
  else currentDay = fmt(addDays(parseDate(currentDay), delta));
  renderDay();
}

function renderDay() {
  const d = parseDate(currentDay);
  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  document.getElementById('dayLabel').textContent =
    `${currentDay} 星期${weekdays[d.getDay()]}`;

  for (let q = 1; q <= 4; q++) {
    const body = document.querySelector(`.quadrant-body[data-q="${q}"]`);
    body.innerHTML = '';
    const allTasks = sortTasks(filterByCategory(state.tasks.filter(t => t.date === currentDay && t.quadrant === q)));
    const visibleTasks = showDayDone ? allTasks : allTasks.filter(t => !t.done);
    const hiddenDoneCount = allTasks.filter(t => t.done).length;

    if (visibleTasks.length === 0) {
      const hint = document.createElement('button');
      if (!showDayDone && hiddenDoneCount > 0) {
        hint.className = 'empty-hint folded';
        hint.textContent = `${hiddenDoneCount} 项已完成（已折叠）`;
        hint.addEventListener('click', toggleShowDayDone);
      } else {
        hint.className = 'empty-hint';
        hint.textContent = '今天还没有任务，点这里添加';
        hint.addEventListener('click', () => openTaskModal('day', q));
      }
      body.appendChild(hint);
    } else {
      visibleTasks.forEach(t => body.appendChild(buildTaskCard(t, 'day')));
      // 有已完成被折叠时，底部加折叠提示
      if (!showDayDone && hiddenDoneCount > 0) {
        const foldedHint = document.createElement('button');
        foldedHint.className = 'empty-hint folded';
        foldedHint.style.marginTop = '4px';
        foldedHint.textContent = `${hiddenDoneCount} 项已完成（已折叠）`;
        foldedHint.addEventListener('click', toggleShowDayDone);
        body.appendChild(foldedHint);
      }
    }
    const quadrant = body.parentElement;
    bindDropZone(quadrant, 'day', q);
  }

  // 更新今日完成率进度条（统计全部任务，不受折叠影响）
  const allDayTasks = state.tasks.filter(t => t.date === currentDay);
  const total = allDayTasks.length;
  const done = allDayTasks.filter(t => t.done).length;
  const pct = total === 0 ? 0 : Math.round((done / total) * 100);
  document.getElementById('dayProgressStats').textContent = `已完成 ${done} / ${total} 项`;
  document.getElementById('dayProgressFill').style.width = `${pct}%`;
  document.getElementById('dayProgressPct').textContent = total === 0 ? '—' : `${pct}%`;

  renderTimeline();
}

// =============== 今日时间轴 ===============
function getTaskTime(t) {
  // 优先 startTime，兼容旧 time 字段
  return t.startTime || t.time || null;
}

function classifyTimeSlot(timeStr) {
  // 返回 'morning' | 'afternoon' | 'evening' | 'unscheduled'
  if (!timeStr) return 'unscheduled';
  const [h] = timeStr.split(':').map(Number);
  if (h >= 6 && h < 12) return 'morning';
  if (h >= 12 && h < 18) return 'afternoon';
  if (h >= 18 || h < 6) return 'evening';
  return 'unscheduled';
}

function buildTimelineTask(t) {
  const startTime = getTaskTime(t);
  const endTime = t.endTime || null;

  let timeLabel = '';
  if (startTime && endTime) {
    timeLabel = `${startTime} – ${endTime}`;
  } else if (startTime) {
    timeLabel = startTime;
  }

  const q = t.quadrant || 2;
  const cat = t.category
    ? (state.categories || []).find(c => c.id === t.category)
    : (t.projectId ? (() => { const proj = state.projects.find(p => p.id === t.projectId); return proj && proj.category ? (state.categories || []).find(c => c.id === proj.category) : null; })() : null);
  const catTag = cat ? `<span class="cat-tag" style="background:${cat.color}18;color:${cat.color};border:1px solid ${cat.color}40;font-size:9px;padding:0 5px"><span class="cat-dot" style="background:${cat.color}"></span>${escapeHtml(cat.name)}</span>` : '';

  const div = document.createElement('div');
  div.className = 'timeline-task' + (t.done ? ' done' : '');
  div.dataset.id = t.id;
  div.dataset.q = q;

  div.innerHTML = `
    <button class="timeline-task-check" onclick="event.stopPropagation(); toggleTimelineTaskDone('${t.id}')" title="${t.done ? '标记未完成' : '标记完成'}">${t.done ? '✓' : ''}</button>
    <div class="timeline-task-body">
      ${timeLabel ? `<div class="timeline-task-time">${escapeHtml(timeLabel)}</div>` : ''}
      <div class="timeline-task-title">${catTag}<span class="quad-tag" data-q="${q}" style="font-size:9px;padding:1px 4px;vertical-align:1px">${QUAD_LABELS[q]}</span>${escapeHtml(t.title)}</div>
    </div>
  `;

  // 整行单击打开编辑弹窗（勾选按钮已 stopPropagation）
  div.style.cursor = 'pointer';
  div.addEventListener('click', () => openTaskModal('day', null, t.id));

  return div;
}

function renderTimeline() {
  const tasks = filterByCategory(state.tasks.filter(t => t.date === currentDay));

  const slots = { morning: [], afternoon: [], evening: [], unscheduled: [] };
  tasks.forEach(t => {
    const slot = classifyTimeSlot(getTaskTime(t));
    slots[slot].push(t);
  });

  // 各区块按时间排序
  ['morning', 'afternoon', 'evening'].forEach(slot => {
    slots[slot].sort((a, b) => {
      const ta = getTaskTime(a) || '';
      const tb = getTaskTime(b) || '';
      return ta.localeCompare(tb);
    });
  });
  // 未安排按 order 排
  slots.unscheduled.sort((a, b) => (a.order || 0) - (b.order || 0));

  const bodyIds = {
    morning: 'tlMorningBody',
    afternoon: 'tlAfternoonBody',
    evening: 'tlEveningBody',
    unscheduled: 'tlUnscheduledBody'
  };

  const slotDefaultQuad = {
    morning: 1,
    afternoon: 2,
    evening: 2,
    unscheduled: 2
  };

  Object.entries(bodyIds).forEach(([slot, bodyId]) => {
    const body = document.getElementById(bodyId);
    if (!body) return;
    body.innerHTML = '';

    const allSlotTasks = slots[slot];
    const visibleTasks = showDayDone ? allSlotTasks : allSlotTasks.filter(t => !t.done);
    const hiddenDoneCount = allSlotTasks.filter(t => t.done).length;

    if (visibleTasks.length === 0) {
      const hint = document.createElement('button');
      if (!showDayDone && hiddenDoneCount > 0) {
        hint.className = 'empty-hint folded';
        hint.textContent = `${hiddenDoneCount} 项已完成（已折叠）`;
        hint.addEventListener('click', toggleShowDayDone);
      } else {
        hint.className = 'empty-hint';
        hint.textContent = '这个时间段还没有任务，点这里添加';
        hint.addEventListener('click', () => openTaskModal('day', slotDefaultQuad[slot]));
      }
      body.appendChild(hint);
    } else {
      visibleTasks.forEach(t => body.appendChild(buildTimelineTask(t)));
      // 有已完成被折叠时，底部加折叠提示
      if (!showDayDone && hiddenDoneCount > 0) {
        const foldedHint = document.createElement('button');
        foldedHint.className = 'empty-hint folded';
        foldedHint.style.marginTop = '4px';
        foldedHint.textContent = `${hiddenDoneCount} 项已完成（已折叠）`;
        foldedHint.addEventListener('click', toggleShowDayDone);
        body.appendChild(foldedHint);
      }
    }
  });
}

function toggleTimelineTaskDone(id) {
  const t = state.tasks.find(x => x.id === id);
  if (t) t.done = !t.done;
  saveState();
  // renderDay() 内部会调用 renderTimeline()，并统计进度条，同时遵守 showDayDone 过滤
  renderDay();
  renderOverview();
}

// =============== 任务卡片 ===============
const QUAD_LABELS = { 1: '重要紧急', 2: '重要', 3: '紧急', 4: '次要' };

function buildTaskCard(task, type) {
  const card = document.createElement('div');
  card.className = 'task-card' + (task.done ? ' done' : '');
  card.draggable = true;
  card.dataset.id = task.id;
  card.dataset.type = type;
  card.dataset.q = task.quadrant || 2;

  const project = task.projectId ? state.projects.find(p => p.id === task.projectId) : null;

  // 板块标签
  const cat = task.category
    ? (state.categories || []).find(c => c.id === task.category)
    : (project && project.category ? (state.categories || []).find(c => c.id === project.category) : null);
  const catHtml = cat ? `<span class="cat-tag" style="background:${cat.color}18;color:${cat.color};border:1px solid ${cat.color}40"><span class="cat-dot" style="background:${cat.color}"></span>${escapeHtml(cat.name)}</span>` : '';

  let metaHtml = '';
  if (project) {
    metaHtml = `
      <div class="task-card-meta">
        <span class="project-color-dot" style="background:${project.color};width:8px;height:8px"></span>
        <span>${escapeHtml(project.name)}</span>
      </div>`;
  }

  const timeHtml = task.time ? `<span class="task-time">${task.time}</span>` : '';
  // 周看板里显示象限标签，四象限里不重复显示
  const quadHtml = type === 'week'
    ? `<span class="quad-tag" data-q="${task.quadrant || 2}">${QUAD_LABELS[task.quadrant || 2]}</span>`
    : '';

  card.innerHTML = `
    <div>${catHtml}${quadHtml}${timeHtml}${escapeHtml(task.title)}</div>
    ${metaHtml}
    <div class="task-card-actions" onclick="event.stopPropagation()">
      <button class="icon-btn" onclick="toggleTaskDone('${type}', '${task.id}')">${task.done ? '↺' : '✓'}</button>
      <button class="icon-btn" onclick="openTaskModal('${type}', null, '${task.id}')">✎</button>
    </div>
  `;

  // 整卡单击编辑；dragstart 不触发 click（浏览器标准行为），无需额外处理
  card.addEventListener('click', () => openTaskModal(type, null, task.id));

  card.addEventListener('dragstart', e => {
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', JSON.stringify({ id: task.id, type }));
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));

  return card;
}

function toggleTaskDone(type, id) {
  const t = state.tasks.find(x => x.id === id);
  if (t) t.done = !t.done;
  saveState();
  if (type === 'week') renderWeek(); else renderDay();
  renderOverview();
}

// =============== 拖拽 ===============
function bindDropZone(el, type, target) {
  el.addEventListener('dragover', e => {
    e.preventDefault();
    el.classList.add('drag-over');
  });
  el.addEventListener('dragleave', e => {
    if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over');
  });
  el.addEventListener('drop', e => {
    e.preventDefault();
    el.classList.remove('drag-over');
    let data;
    try { data = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
    if (data.type !== type) return;

    const t = state.tasks.find(x => x.id === data.id);
    if (!t) return;
    if (type === 'week') t.date = target;
    else t.quadrant = target;
    saveState();
    if (type === 'week') renderWeek(); else renderDay();
    renderOverview();
  });
}

// =============== 任务弹窗 ===============
function openTaskModal(type, ctx, id) {
  refreshProjectOptions();
  const overlay = document.getElementById('taskModal');
  const isWeek = type === 'week';

  // 切换 week-mode class（影响弹窗宽度/样式，不影响长期项目弹窗）
  if (isWeek) {
    overlay.classList.add('week-mode');
    document.getElementById('taskTitleLabel').textContent = '任务名';
    document.getElementById('taskTitle').placeholder = '如：完成竞品调研';
  } else {
    overlay.classList.remove('week-mode');
    document.getElementById('taskTitleLabel').textContent = '任务标题';
    document.getElementById('taskTitle').placeholder = '要做什么…';
  }

  if (id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    editing = { type: 'task_' + type, id };
    document.getElementById('taskModalTitle').textContent = isWeek ? '编辑周任务' : '编辑任务';
    document.getElementById('taskTitle').value = t.title;
    document.getElementById('taskProject').value = t.projectId || '';
    refreshCategorySelect('taskCategory', t.category);
    document.getElementById('taskDelete').style.display = '';

    if (isWeek) {
      document.getElementById('taskExtraField').innerHTML = _weekExtraHTML({
        startDate: t.startDate || t.date,
        endDate: t.endDate || t.date,
        startTime: t.startTime || t.time || '',
        endTime: t.endTime || '',
        quadrant: t.quadrant || 2,
        notes: t.notes || ''
      });
    } else {
      document.getElementById('taskExtraField').innerHTML = _dayExtraHTML({
        date: t.date,
        startTime: t.startTime || t.time || '',
        endTime: t.endTime || '',
        quadrant: t.quadrant || 2
      });
    }
  } else {
    editing = { type: 'task_' + type, id: null, ctx };
    document.getElementById('taskModalTitle').textContent = isWeek ? '新增周任务' : '新增任务';
    document.getElementById('taskTitle').value = '';
    document.getElementById('taskProject').value = '';
    refreshCategorySelect('taskCategory', null);
    document.getElementById('taskDelete').style.display = 'none';

    const defaultDate = isWeek ? (ctx || fmt(new Date())) : currentDay;
    const defaultQuad = type === 'day' ? ctx : 2;

    if (isWeek) {
      document.getElementById('taskExtraField').innerHTML = _weekExtraHTML({
        startDate: defaultDate,
        endDate: defaultDate,
        startTime: '',
        endTime: '',
        quadrant: defaultQuad,
        notes: ''
      });
    } else {
      document.getElementById('taskExtraField').innerHTML = _dayExtraHTML({
        date: defaultDate,
        startTime: '',
        endTime: '',
        quadrant: defaultQuad
      });
    }
  }
  openModal('taskModal');
  setTimeout(() => document.getElementById('taskTitle').focus(), 50);
}

    <div class="form-row-datetime">

        <label>开始日期</label>
        <input type="date" id="taskStartDate" value="${esc(startDate)}">

      </div>
      <div class="form-group">
        <label>开始时间（可选）</label>
        <input type="time" id="taskTime" value="${esc(startTime)}">
      </div>
      <div class="form-group">
        <label>结束时间（可选）</label>
        <input type="time" id="taskEndTime" value="${esc(endTime)}">

    </div>
    <div class="form-group">
      <label>优先级 / 象限</label>

// 日任务弹窗内部字段 HTML（沿用原有紧凑样式）
function _dayExtraHTML({ date, startTime, endTime, quadrant }) {
  const q = v => quadrant === v ? 'selected' : '';
  const esc = s => String(s || '').replace(/"/g, '&quot;');
  return `
    <div class="form-row">
      <div class="form-group">
        <label>日期</label>
        <input type="date" id="taskDate" value="${esc(date)}">
      </div>
      <div class="form-group">
        <label>开始时间（可选）</label>
        <input type="time" id="taskTime" value="${esc(startTime)}">
      </div>
      <div class="form-group">
        <label>结束时间（可选）</label>
        <input type="time" id="taskEndTime" value="${esc(endTime)}">
      </div>
    </div>
    <div class="form-group">

function refreshProjectOptions() {

  sel.innerHTML = '<option value="">— 独立任务 —</option>';

    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.name;
    sel.appendChild(o);
  });

function saveTask() {
  const title = document.getElementById('taskTitle').value.trim();
  if (!title) return alert('请填写任务标题');
  const projectId = document.getElementById('taskProject').value || null;
  const startTime = document.getElementById('taskTime').value || null;
  const endTime = document.getElementById('taskEndTime') ? (document.getElementById('taskEndTime').value || null) : null;
  const quadrant = parseInt(document.getElementById('taskQuadrant').value);
  const notesEl = document.getElementById('taskNotes');
  const notes = notesEl ? notesEl.value.trim() : null;
  const isWeek = editing.type === 'task_week';

  // 周任务读取 startDate/endDate；日任务读取 taskDate
  let date, startDate, endDate;
  if (isWeek) {
    startDate = document.getElementById('taskStartDate').value;
    endDate   = document.getElementById('taskEndDate').value;
    // 结束日期不能早于开始日期，自动修正
    if (endDate && startDate && endDate < startDate) endDate = startDate;
    date = startDate; // 兼容旧字段
  } else {
    date = document.getElementById('taskDate').value;
  }

  if (editing.id) {
    const t = state.tasks.find(x => x.id === editing.id);
    t.title = title;
    t.projectId = projectId;
    t.category = document.getElementById('taskCategory').value || null;
    t.startTime = startTime;
    t.endTime = endTime;
    t.time = startTime; // 保持向后兼容
    t.date = date;
    t.quadrant = quadrant;
    if (notes !== null) t.notes = notes;
    if (isWeek) {
      t.startDate = startDate;
      t.endDate   = endDate;
    }
  } else {
    const newTask = {
      id: uid(), title, projectId,
      category: document.getElementById('taskCategory').value || null,
      startTime, endTime,
      time: startTime, // 向后兼容
      date, quadrant,
      notes: notes || null,
      done: false, order: Date.now()
    };
    if (isWeek) {
      newTask.startDate = startDate;
      newTask.endDate   = endDate;
    }
    state.tasks.push(newTask);
  }
  saveState();
  closeModal('taskModal');
  if (isWeek) renderWeek(); else renderDay();
  renderOverview();
  showToast('任务已保存');
}

function deleteTask() {
  if (!editing.id) return;
  if (!confirm('确认删除此任务？')) return;
  const isWeek = editing.type === 'task_week';
  state.tasks = state.tasks.filter(t => t.id !== editing.id);
  saveState();
  closeModal('taskModal');
  if (isWeek) renderWeek(); else renderDay();
  renderOverview();
}

// =============== 工具 ===============
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// =============== 板块管理 ===============
function refreshCategorySelect(selectId, selectedVal) {
  const sel = document.getElementById(selectId);
  if (!sel) return;
  sel.innerHTML = '<option value="">— 不归类 —</option>';
  (state.categories || []).forEach(c => {
    const o = document.createElement('option');
    o.value = c.id;
    o.textContent = c.name;
    if (c.id === selectedVal) o.selected = true;
    sel.appendChild(o);
  });
  const customOpt = document.createElement('option');
  customOpt.value = '__custom__';
  customOpt.textContent = '+ 自定义板块…';
  sel.appendChild(customOpt);

  sel.onchange = function() {
    if (sel.value === '__custom__') {
      const name = prompt('请输入新板块名称：');
      if (name && name.trim()) {
        const color = CAT_COLORS[(state.categories || []).length % CAT_COLORS.length];
        const newCat = { id: uid(), name: name.trim(), color };
        if (!state.categories) state.categories = [];
        state.categories.push(newCat);
        saveState();
        renderCategoryFilterBar();
        refreshCategorySelect(selectId, newCat.id);
      } else {
        sel.value = selectedVal || '';
      }
    }
  };
}

function renderCategoryManager() {
  const list = document.getElementById('categoryList');
  if (!list) return;
  const cats = state.categories || [];
  if (cats.length === 0) {
    list.innerHTML = '<div style="font-size:12px;color:var(--ink-light);padding:4px 0">还没有板块，点下方按钮添加</div>';
    return;
  }
  list.innerHTML = cats.map(c => `
    <div class="settings-row">
      <span><span class="cat-dot" style="background:${c.color}"></span> ${escapeHtml(c.name)}</span>
      <span>
        <button class="icon-btn" onclick="editCategory('${c.id}')">✎</button>
        <button class="icon-btn" onclick="deleteCategory('${c.id}')">✕</button>
      </span>
    </div>

const CAT_COLORS = ['#007aff','#34c759','#ff9500','#af52de','#ff3b30','#5ac8fa','#ff2d55','#64d2ff'];

function addCategory() {
  const name = prompt('板块名称：');
  if (!name || !name.trim()) return;
  if (!state.categories) state.categories = [];
  const color = CAT_COLORS[state.categories.length % CAT_COLORS.length];
  state.categories.push({ id: uid(), name: name.trim(), color });
  saveState();
  renderCategoryManager();
  renderCategoryFilterBar();

function editCategory(id) {
  const c = (state.categories || []).find(x => x.id === id);
  if (!c) return;
  const name = prompt('修改板块名称：', c.name);
  if (name === null) return;
  if (name.trim()) c.name = name.trim();
  saveState();
  renderCategoryManager();
  renderCategoryFilterBar();
  renderAll();

function deleteCategory(id) {
  if (!confirm('删除此板块？已关联的项目/任务会变为"未归类"')) return;
  state.categories = (state.categories || []).filter(c => c.id !== id);
  state.projects.forEach(p => { if (p.category === id) p.category = null; });
  state.tasks.forEach(t => { if (t.category === id) t.category = null; });
  if (currentCategory === id) currentCategory = null;
  saveState();
  renderCategoryManager();
  renderCategoryFilterBar();
  renderAll();
}

// =============== 甘特条 resize 拖动 ===============
(function () {
  // 拖动状态
  let _drag = null;
  // _drag = {
  //   side: 'left'|'right',
  //   projectId: string,
  //   startX: number,          // mousedown 时的 clientX
  //   origStart: Date,         // 拖动前的 start
  //   origEnd: Date,           // 拖动前的 end
  //   bar: HTMLElement,        // 甘特条 DOM
  //   moved: false             // 是否真的移动过（用于阻止 click）
  // }

  // 把像素偏移量换算成天数（四舍五入到整天）
  function pxToDays(px) {
    return Math.round(px / GANTT_DAY_PX);
  }

  // 把 Date 转成 "YYYY-MM-DD" 字符串
  function dateToStr(d) {
    return fmt(d);
  }

  // 根据 earliestStart + 日期算出 bar 的 left px
  function dateToPx(d) {
    if (!ganttEarliestStart) return 0;
    return daysBetween(ganttEarliestStart, d) * GANTT_DAY_PX;
  }

  // mousedown 在 handle 上
  document.addEventListener('mousedown', function (e) {
    const handle = e.target.closest('.gantt-resize-handle');
    if (!handle) return;

    e.preventDefault();
    e.stopPropagation();

    const projectId = handle.dataset.projectId;
    const side = handle.dataset.side;
    const p = state.projects.find(x => x.id === projectId);
    if (!p || !ganttEarliestStart) return;

    const bar = handle.closest('.gantt-bar');
    if (!bar) return;

    _drag = {
      side,
      projectId,
      startX: e.clientX,
      origStart: parseDate(p.start),
      origEnd: parseDate(p.end),
      bar,
      moved: false
    };

    document.body.style.cursor = 'ew-resize';
    document.body.style.userSelect = 'none';
  });

  // mousemove：实时更新 bar 外观
  document.addEventListener('mousemove', function (e) {
    if (!_drag) return;

    const dx = e.clientX - _drag.startX;
    const deltaDays = pxToDays(dx);
    if (deltaDays !== 0) _drag.moved = true;

    const p = state.projects.find(x => x.id === _drag.projectId);
    if (!p) return;

    let newStart = new Date(_drag.origStart);
    let newEnd   = new Date(_drag.origEnd);

    if (_drag.side === 'left') {
      newStart = addDays(_drag.origStart, deltaDays);
      // 保证 start 不晚于 end - 1天
      const maxStart = addDays(_drag.origEnd, -1);
      if (newStart > maxStart) newStart = maxStart;
    } else {
      newEnd = addDays(_drag.origEnd, deltaDays);
      // 保证 end 不早于 start + 1天
      const minEnd = addDays(_drag.origStart, 1);
      if (newEnd < minEnd) newEnd = minEnd;
    }

    // 实时更新 bar 位置和宽度
    const newLeft  = dateToPx(newStart);
    const newWidth = Math.max((daysBetween(newStart, newEnd) + 1) * GANTT_DAY_PX, GANTT_DAY_PX);
    _drag.bar.style.left  = newLeft  + 'px';
    _drag.bar.style.width = newWidth + 'px';

    // 更新 tooltip
    _drag.bar.title = `${p.name}\n开始：${dateToStr(newStart)}\n截止：${dateToStr(newEnd)}`;
  });

  // mouseup：写回 state
  document.addEventListener('mouseup', function (e) {
    if (!_drag) return;

    document.body.style.cursor = '';
    document.body.style.userSelect = '';

    if (_drag.moved) {
      const dx = e.clientX - _drag.startX;
      const deltaDays = pxToDays(dx);

      const p = state.projects.find(x => x.id === _drag.projectId);
      if (p) {
        let newStart = new Date(_drag.origStart);
        let newEnd   = new Date(_drag.origEnd);

        if (_drag.side === 'left') {
          newStart = addDays(_drag.origStart, deltaDays);
          const maxStart = addDays(_drag.origEnd, -1);
          if (newStart > maxStart) newStart = maxStart;
        } else {
          newEnd = addDays(_drag.origEnd, deltaDays);
          const minEnd = addDays(_drag.origStart, 1);
          if (newEnd < minEnd) newEnd = minEnd;
        }

        p.start = dateToStr(newStart);
        p.end   = dateToStr(newEnd);
        saveState();
        renderGantt();
        renderOverview();
        showToast(`已更新：${p.name}  ${p.start} ~ ${p.end}`);
      }
    }

    _drag = null;
  });

  // 阻止 handle 上的 click 冒泡到 bar（防止触发 showProjectDetail）
  document.addEventListener('click', function (e) {
    if (e.target.closest('.gantt-resize-handle')) {
      e.stopPropagation();
    }
  }, true);
})();

// =============== 云同步 / 账号 ===============
function schedulePush() {
  if (!currentUser) return;
  clearTimeout(_pushTimer);
  _pushTimer = setTimeout(pushToCloud, 1000);
}

async function pushToCloud(opts = {}) {
  if (!currentUser || !window.__supabase) return;
  if (_isSyncing) return;
  _isSyncing = true;
  setAuthBadge('syncing');
  const meta = getMeta();
  const stamp = meta.localUpdatedAt || new Date().toISOString();
  const { error } = await window.__supabase
    .from('user_data')
    .upsert({
      user_id: currentUser.id,
      data: state,
      updated_at: stamp
    });
  _isSyncing = false;
  if (error) {
    setAuthBadge('error');
    if (opts.silent !== true) showToast('同步失败,已暂存本地');
    document.getElementById('syncError').textContent = error.message || '同步失败';
    return;
  }
  setMeta({ lastSyncedAt: stamp });
  setAuthBadge('synced');
  document.getElementById('syncError').textContent = '';
  updateSettingsModal();
  if (opts.silent !== true) showToast('已同步');
}

async function pullFromCloud() {
  if (!currentUser || !window.__supabase) return;
  setAuthBadge('syncing');
  const { data, error } = await window.__supabase
    .from('user_data')
    .select('data, updated_at')
    .eq('user_id', currentUser.id)
    .maybeSingle();
  if (error) {
    setAuthBadge('error');
    document.getElementById('syncError').textContent = error.message || '拉取失败';
    return;
  }
  const meta = getMeta();
  if (!data) {
    // 云端无记录,推一次本地数据
    if (state.projects.length || state.tasks.length) {
      await pushToCloud({ silent: true });
    } else {
      setAuthBadge('synced');
    }
    return;
  }
  const cloudTime = data.updated_at;
  const localTime = meta.localUpdatedAt;
  const lastSynced = meta.lastSyncedAt;

  if (!localTime || cloudTime > localTime) {
    state = data.data || { projects: [], tasks: [] };
    if (!state.projects) state.projects = [];
    if (!state.tasks) state.tasks = [];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    setMeta({ localUpdatedAt: cloudTime, lastSyncedAt: cloudTime });
    renderAll();
    setAuthBadge('synced');
    showToast('已从云端拉取最新');
  } else if (localTime > (lastSynced || '')) {
    await pushToCloud({ silent: true });
  } else {
    setAuthBadge('synced');
  }
  updateSettingsModal();
}

function renderBoards() {
  const container = document.getElementById('boardsContent');
  if (!container) return;
  const cats = state.categories || [];

  if (cats.length === 0) {
    container.innerHTML = '<div class="board-empty">还没有板块<br><br>点上方"管理板块"添加一个</div>';
    return;
  }

  const groups = [];
  const filteredCats = currentCategory ? cats.filter(c => c.id === currentCategory) : cats;

  filteredCats.forEach(cat => {
    const projects = state.projects.filter(p => p.category === cat.id);
    const standaloneTasks = state.tasks.filter(t => t.category === cat.id && !t.projectId);
    groups.push({ cat, projects, standaloneTasks });
  });

  if (!currentCategory) {
    const uncatProjects = state.projects.filter(p => !p.category);
    const uncatTasks = state.tasks.filter(t => !t.category && !t.projectId);
    if (uncatProjects.length > 0 || uncatTasks.length > 0) {
      groups.push({ cat: { id: '_uncat', name: '未归类', color: '#86868b' }, projects: uncatProjects, standaloneTasks: uncatTasks });
    }
  }

  let html = '';
  groups.forEach(g => {
    const totalTasks = g.projects.reduce((sum, p) => sum + state.tasks.filter(t => t.projectId === p.id).length, 0) + g.standaloneTasks.length;
    const doneTasks = g.projects.reduce((sum, p) => sum + state.tasks.filter(t => t.projectId === p.id && t.done).length, 0) + g.standaloneTasks.filter(t => t.done).length;

    html += `<div class="board-card">
      <div class="board-card-header" onclick="toggleBoardCard(this)">
        <div class="board-card-title">
          <span class="cat-dot" style="background:${g.cat.color}"></span>
          ${escapeHtml(g.cat.name)}
        </div>
        <div class="board-card-stats">${g.projects.length} 项目 · ${doneTasks}/${totalTasks} 任务</div>
      </div>
      <div class="board-card-body">`;

    g.projects.forEach(p => {
      const progress = calcProjectProgress(p);
      const tasks = state.tasks.filter(t => t.projectId === p.id);
      const daysLeft = daysBetween(new Date(), parseDate(p.end));
      const deadlineText = p.done ? '已完成' : (daysLeft < 0 ? '已逾期' : `截止 ${p.end}`);
      const barColor = p.done ? 'var(--green)' : p.color;

      html += `<div class="board-project">
        <div class="board-project-header" onclick="openProjectModal('${p.id}')">
          <span class="project-color-dot" style="background:${p.color};width:8px;height:8px"></span>
          <span class="board-project-name">${escapeHtml(p.name)}</span>
          <div class="board-project-meta">
            <span>${deadlineText}</span>
            <div class="board-progress-bar"><div class="board-progress-fill" style="width:${progress.pct}%;background:${barColor}"></div></div>
            <span>${progress.pct}%</span>
          </div>
        </div>`;

      if (tasks.length > 0) {
        html += '<div class="board-task-list">';
        tasks.forEach(t => {
          const qTag = `<span class="quad-tag" data-q="${t.quadrant||2}" style="font-size:9px;padding:0 4px">${QUAD_LABELS[t.quadrant||2]}</span>`;
          html += `<div class="board-task ${t.done?'done':''}" onclick="openTaskModal('day',null,'${t.id}')">
            <span class="board-task-check">${t.done?'✓':''}</span>
            ${qTag} ${escapeHtml(t.title)}
          </div>`;
        });
        html += '</div>';
      }
      html += '</div>';
    });

    if (g.standaloneTasks.length > 0) {
      html += '<div class="board-standalone-title">独立任务</div><div class="board-task-list">';
      g.standaloneTasks.forEach(t => {
        html += `<div class="board-task ${t.done?'done':''}" onclick="openTaskModal('day',null,'${t.id}')">
          <span class="board-task-check">${t.done?'✓':''}</span>
          ${escapeHtml(t.title)}
        </div>`;
      });
      html += '</div>';
    }

    html += '</div></div>';
  });

  container.innerHTML = html;
}

// =============== 系列任务 ===============
function renderSeries() {
  const container = document.getElementById('seriesContent');
  if (!container) return;

  const todayStr = fmt(new Date());
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  // 只显示有关联任务的项目
  const projectsWithTasks = state.projects.filter(p => {
    return state.tasks.some(t => t.projectId === p.id);
  });

  if (projectsWithTasks.length === 0) {
    container.innerHTML = '<div class="series-empty">还没有系列任务<br><br>在添加周任务或今日任务时关联一个长期项目，就会出现在这里。</div>';
    return;
  }

  let html = '';
  projectsWithTasks.forEach(p => {
    const tasks = sortTasks(state.tasks.filter(t => t.projectId === p.id));
    const totalSteps = tasks.length;
    const doneSteps = tasks.filter(t => t.done).length;
    const undoneSteps = totalSteps - doneSteps;
    const pct = totalSteps === 0 ? 0 : Math.round((doneSteps / totalSteps) * 100);

    // 日期范围
    const dates = tasks.map(t => t.date).filter(Boolean).sort();
    const dateRange = dates.length > 0
      ? `${dates[0]} → ${dates[dates.length - 1]}`
      : '无日期';

    // 逾期步骤
    const overdue = tasks.filter(t => !t.done && t.date && t.date < todayStr);
    const overdueCount = overdue.length;

    // 下一步：第一个未完成的任务
    const nextTask = tasks.find(t => !t.done);

    html += `<div class="series-card">
      <div class="series-card-head">
        <span class="project-color-dot" style="background:${p.color};width:12px;height:12px"></span>
        <span class="series-card-name">${escapeHtml(p.name)}</span>
        <button class="series-card-edit" onclick="openProjectModal('${p.id}')" title="编辑项目">✎</button>
      </div>
      <div class="series-card-meta">
        ${totalSteps} 个步骤 · ${undoneSteps} 个未完成 · ${dateRange}
      </div>
      <div class="series-progress-wrap">
        <div class="series-progress-bar">
          <div class="series-progress-fill" style="width:${pct}%;background:${p.color}"></div>
        </div>
        <span class="series-progress-pct" style="color:${p.color}">${pct}%</span>
      </div>`;

    if (nextTask) {
      const nextTime = nextTask.time ? `${nextTask.time} ` : '';
      html += `<div class="series-next">
        <div class="series-next-label">下一步</div>
        <div class="series-next-task">${nextTime}${escapeHtml(nextTask.title)}</div>
      </div>`;
    }

    if (overdueCount > 0) {
      html += `<div class="series-warn">${overdueCount} 个步骤已逾期，需要今天处理。</div>`;
    }

    html += '<ul class="series-steps">';
    tasks.forEach(t => {
      const dateLabel = t.date || '';
      html += `<li class="series-step ${t.done ? 'done' : ''}" onclick="openTaskModal('day',null,'${t.id}')">
        <button class="series-step-check" onclick="event.stopPropagation();toggleSeriesTask('${t.id}')">${t.done ? '✓' : ''}</button>
        <span>${escapeHtml(t.title)}</span>
        <span class="series-step-date">${dateLabel}</span>
      </li>`;
    });
    html += '</ul></div>';
  });

  container.innerHTML = html;
}

async function authLogin() {
  if (!window.__supabase) {
    document.getElementById('authError').textContent = 'Supabase 还没加载完,稍候再试';
    return;
  }
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) {
    document.getElementById('authError').textContent = '邮箱和密码都得填';
    return;
  }
  const btn = document.getElementById('authLoginBtn');
  btn.disabled = true; btn.textContent = '登录中…';
  const { data, error } = await window.__supabase.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = '登录';
  if (error) {
    document.getElementById('authError').textContent = error.message || '登录失败';
    return;
  }
  currentUser = data.user;
  document.getElementById('authPassword').value = '';
  updateSettingsModal();
  setAuthBadge('synced');
  closeModal('settingsModal');
  showToast('已登录');
  await pullFromCloud();
}

async function authSignup() {
  if (!window.__supabase) {
    document.getElementById('authError').textContent = 'Supabase 还没加载完,稍候再试';
    return;
  }
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  if (!email || !password) {
    document.getElementById('authError').textContent = '邮箱和密码都得填';
    return;
  }
  if (password.length < 6) {
    document.getElementById('authError').textContent = '密码至少 6 位';
    return;
  }
  const btn = document.getElementById('authSignupBtn');
  btn.disabled = true; btn.textContent = '注册中…';
  const { data, error } = await window.__supabase.auth.signUp({ email, password });
  btn.disabled = false; btn.textContent = '注册新账号';
  if (error) {
    document.getElementById('authError').textContent = error.message || '注册失败';
    return;
  }
  if (!data.session) {
    document.getElementById('authError').textContent = '注册成功,但需要邮箱验证。请去 Supabase 后台关闭邮箱验证或验证邮箱后再登录。';
    return;
  }
  currentUser = data.user;
  document.getElementById('authPassword').value = '';
  updateSettingsModal();
  setAuthBadge('synced');
  closeModal('settingsModal');
  showToast('账号已创建,自动登录');
  await pullFromCloud();
}

async function authLogout() {
  if (!window.__supabase) return;
  await window.__supabase.auth.signOut();
  currentUser = null;
  setAuthBadge();
  updateSettingsModal();
  showToast('已退出登录');
}

async function manualSync() {
  if (!currentUser) return;
  await pullFromCloud();
}

// supabase-js 加载完成后初始化 auth
window.addEventListener('supabase-ready', async () => {
  try {
    const { data: { session } } = await window.__supabase.auth.getSession();
    if (session) {
      currentUser = session.user;
      setAuthBadge('synced');
      updateSettingsModal();
      await pullFromCloud();
    } else {
      setAuthBadge();
    }
  } catch (e) {
    console.warn('Supabase 初始化失败:', e);
    setAuthBadge();
  }
});

// =============== 启动 ===============
updateDateDisplay();
renderOverview();
refreshProjectOptions();
setInterval(updateDateDisplay, 60000);
setAuthBadge();

// 键盘快捷键：Esc 关闭弹窗
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal-overlay.show').forEach(m => closeModal(m.id));
  }
});
</script>
